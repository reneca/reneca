---
- name: Check for graphical environment
  ansible.builtin.shell: |
    if [ "$(uname)" = "Darwin" ]; then
      # Check for WindowServer on MacOS
      if pgrep -x WindowServer > /dev/null; then
        echo "true"
      else
        echo "false"
      fi
    else
      # Check for DISPLAY or Xorg/Wayland on Linux
      if [ -n "$DISPLAY" ]; then
        echo "true"
      elif ps aux | grep -E 'Xorg|wayland' | grep -v grep; then
        echo "true"
      else
        echo "false"
      fi
    fi
  register: has_gui_check
  ignore_errors: true
  changed_when: false
  failed_when: false

- name: Set graphical environment fact
  ansible.builtin.set_fact:
    has_gui: "{{ has_gui_check.stdout == 'true' }}"

# Elgato USB vendor id 0x0fd9. On WSL the deck is visible once attached with usbipd.
- name: Check for an Elgato Stream Deck
  ansible.builtin.shell: |
    if [ "$(uname)" = "Darwin" ]; then
      [[ "$(ioreg -p IOUSB -l -w0)" == *'"idVendor" = 4057'* ]]
    else
      grep -qsx 0fd9 /sys/bus/usb/devices/*/idVendor
    fi
  args:
    executable: /bin/bash
  register: has_streamdeck_check
  changed_when: false
  failed_when: false

- name: Set Stream Deck fact
  ansible.builtin.set_fact:
    has_streamdeck: "{{ has_streamdeck_check.rc == 0 }}"

- name: Install Homebrew pre-requisite for MacOS
  community.general.homebrew_cask:
    name: "{{ item }}"
    state: present
  loop:
    - font-hack-nerd-font
  when: ansible_facts['os_family'] == "Darwin"

- name: Check if uv is already installed
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ ansible_facts['env']['HOME'] }}/.local/bin/uv"
    - /usr/local/bin/uv
    - /opt/homebrew/bin/uv
  register: uv_installed

- name: Install uv
  ansible.builtin.shell: |
    set -o pipefail
    curl -LsSf https://astral.sh/uv/install.sh | sh
  args:
    executable: /bin/bash
  changed_when: true
  when: not (uv_installed.results | map(attribute='stat.exists') | select | list)

- name: Install uv tools
  ansible.builtin.command:
    argv:
      - uv
      - tool
      - install
      - "{{ item }}"
  loop:
    - markitdown[all]
  register: uv_tool_install
  changed_when: "'Installed' in uv_tool_install.stderr"
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/bin:{{ ansible_facts['env']['PATH'] }}"

- name: Check if Docker is installed
  ansible.builtin.command: which docker
  register: docker_installed
  ignore_errors: true
  changed_when: false
  failed_when: false

- name: Check if Podman is installed
  ansible.builtin.command: which podman
  register: podman_installed
  ignore_errors: true
  changed_when: false
  failed_when: false

- name: Set container runtime executable
  ansible.builtin.set_fact:
    container_runtime: "{{ ('docker' if docker_installed.rc == 0 else 'podman') | trim }}"
  when: docker_installed.rc == 0 or podman_installed.rc == 0

- name: Check if Oh My Zsh is install
  ansible.builtin.stat:
    path: ~/.oh-my-zsh
  register: ohmyzsh_installed
- name: Configure Oh My Zsh
  include_tasks: zsh.yml
  when: ohmyzsh_installed.stat.exists

- name: Define terminal aliases
  template:
    mode: "0644"
    src: "templates/aliases.j2"
    dest: "~/.aliases"
- name: Source aliases for Zsh
  ansible.builtin.lineinfile:
    path: ~/.zshrc
    line: 'source "$HOME/.aliases"'
    state: present
  when: ohmyzsh_installed.stat.exists
...
