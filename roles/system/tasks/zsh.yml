---
- name: ZSH personnal theme
  template:
    mode: "0644"
    src: "templates/zsh-theme.j2"
    dest: "~/.oh-my-zsh/custom/themes/reneca.zsh-theme"

- name: Define ZSH_THEME
  ansible.builtin.lineinfile:
    path: "~/.zshrc"
    regexp: "^ZSH_THEME="
    line: 'ZSH_THEME="reneca"'
    create: no
    state: present
  ignore_errors: true

- name: Enable bash PATH for ZSH
  replace:
    path: "~/.zshrc"
    regexp: '^#\s*(export PATH=.*)'
    replace: '\1'
  ignore_errors: true
...
