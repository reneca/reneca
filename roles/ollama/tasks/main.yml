---
- name: Check if Ollama is installed
  ansible.builtin.command:
    argv:
      - which
      - "{{ ollama_command }}"
  register: ollama_installed
  changed_when: false
  failed_when: false

- name: Get Ollama version
  ansible.builtin.command:
    argv:
      - "{{ ollama_installed.stdout }}"
      - -v
  register: ollama_version
  changed_when: false
  failed_when: false
  when:
    - ollama_installed.rc == 0
    - ollama_installed.stdout != ""

- name: Store installed Ollama version  # noqa: var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    ollama: >-
      {{
        ollama | combine({
          'version': ollama_version.stdout.split() | last
        })
      }}
  when:
    - ollama_version.rc | default(1) == 0
    - ollama_version.stdout | default('') != ''

- name: Define Ollama endpoint candidate
  ansible.builtin.set_fact:
    ollama_candidate_host: >-
      {{
        (
          lookup('ansible.builtin.env', 'OLLAMA_HOST', default='')
          if lookup('ansible.builtin.env', 'OLLAMA_HOST', default='') != ''
          else ('http://localhost:11434' if ollama_installed.rc == 0 else '')
        )
        | regex_replace('/+$', '')
      }}

- name: Validate configured Ollama endpoint
  ansible.builtin.assert:
    that:
      - ollama_candidate_host is match('^https?://')
    fail_msg: OLLAMA_HOST must be an HTTP or HTTPS URL.
  when: (ollama_candidate_host | default('', true)) != ''

- name: Retrieve Ollama models from API
  ansible.builtin.uri:
    url: "{{ ollama_candidate_host }}/api/tags"
    return_content: true
    timeout: 5
  register: ollama_tags
  failed_when: >-
    lookup('ansible.builtin.env', 'OLLAMA_HOST', default='') != ''
    and (
      ollama_tags.status | default(-1) != 200
      or 'models' not in (ollama_tags.json | default({}))
    )
  when: (ollama_candidate_host | default('', true)) != ''

- name: Store reachable Ollama endpoint and models  # noqa: var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    ollama: >-
      {{
        ollama | combine({
          'host': ollama_candidate_host,
          'models': ollama_tags.json.models
        })
      }}
  when:
    - (ollama_candidate_host | default('', true)) != ''
    - ollama_tags.status | default(-1) == 200
    - "'models' in (ollama_tags.json | default({}))"
...
