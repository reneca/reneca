---
- name: Check if Claude Code is already installed
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin/claude"
  register: claude_installed

- name: Install Claude Code
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL https://claude.ai/install.sh | bash
  args:
    executable: /bin/bash
  changed_when: true
  when: not claude_installed.stat.exists

- name: Ensure Claude configuration folder exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.claude"
    state: directory
    mode: "0700"

- name: Check for a user-provided Claude API key helper  # noqa: var-naming[no-role-prefix]
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.claude/api-key-gen.sh"
  register: api_key_gen_stat

- name: Install OpenRouter API key helper
  ansible.builtin.copy:
    src: openrouter-api-key-helper.sh
    dest: "{{ ansible_facts['env']['HOME'] }}/.claude/openrouter-api-key-helper.sh"
    mode: "0700"
  when:
    - lookup('ansible.builtin.env', 'OPENROUTER_API_KEY', default='') != ''
    - not (api_key_gen_stat.stat.exists and api_key_gen_stat.stat.executable)

- name: Define Claude Code settings facts
  ansible.builtin.set_fact:
    claude_code:
      api_key_helper: >-
        {% if api_key_gen_stat.stat.exists and api_key_gen_stat.stat.executable -%}
          ~/.claude/api-key-gen.sh
        {%- elif lookup('ansible.builtin.env', 'OPENROUTER_API_KEY', default='') != '' -%}
          ~/.claude/openrouter-api-key-helper.sh
        {%- else -%}
          {{ '' }}
        {%- endif %}
      base_url: >-
        {% if lookup('ansible.builtin.env', 'ANTHROPIC_BASE_URL', default='') != '' -%}
          {{ lookup('ansible.builtin.env', 'ANTHROPIC_BASE_URL') }}
        {%- elif lmstudio.host is defined -%}
          {{ lmstudio.host }}
        {%- elif ollama.host is defined -%}
          {{ ollama.host }}
        {%- elif lookup('ansible.builtin.env', 'OPENROUTER_API_KEY', default='') != '' -%}
          https://openrouter.ai/api
        {%- else -%}
          {{ '' }}
        {%- endif %}
      openrouter_enabled: >-
        {{ claude_code_openrouter_enabled }}
      auth_token: >-
        {% if lookup('ansible.builtin.env', 'ANTHROPIC_BASE_URL', default='') != '' -%}
        {%- elif lmstudio.host is defined -%}
          lmstudio
        {%- elif ollama.host is defined -%}
          ollama
        {%- else -%}
          {{ '' }}
        {%- endif %}
      model: "{{ claude_code.model | default(claude_code_default_sonnet_model, true) }}"
      opus_model: "{{ claude_code.opus_model | default(claude_code_default_opus_model, true) }}"
      sonnet_model: "{{ claude_code.sonnet_model | default(claude_code_default_sonnet_model, true) }}"
      haiku_model: "{{ claude_code.haiku_model | default(claude_code_default_haiku_model, true) }}"
  vars:
    claude_code_openrouter_enabled: "{{ lookup('ansible.builtin.env', 'OPENROUTER_API_KEY', default='') != '' }}"
    claude_code_default_opus_model: >-
      {% if lookup('ansible.builtin.env', 'ANTHROPIC_BASE_URL', default='') != '' -%}
        claude-opus
      {%- elif lmstudio.host is defined -%}
        qwen/qwen3-coder-next
      {%- elif ollama.host is defined -%}
        {%- if ollama.version is not defined or ansible_facts['memtotal_mb'] > 90000 -%}
          qwen3-coder-next:q8_0
        {%- else -%}
          qwen3-coder
        {%- endif -%}
      {%- elif claude_code_openrouter_enabled -%}
        ~anthropic/claude-opus-latest
      {%- else -%}
        {{ '' }}
      {%- endif -%}
    claude_code_default_sonnet_model: >-
      {% if lookup('ansible.builtin.env', 'ANTHROPIC_BASE_URL', default='') != '' -%}
        claude-sonnet
      {%- elif lmstudio.host is defined -%}
        qwen/qwen3-coder-next
      {%- elif ollama.host is defined -%}
        {%- if ollama.version is not defined or ansible_facts['memtotal_mb'] > 90000 -%}
          qwen3-coder-next:q8_0
        {%- else -%}
          qwen3-coder
        {%- endif -%}
      {%- elif claude_code_openrouter_enabled -%}
        ~anthropic/claude-sonnet-latest
      {%- else -%}
        {{ '' }}
      {%- endif -%}
    claude_code_default_haiku_model: >-
      {% if lookup('ansible.builtin.env', 'ANTHROPIC_BASE_URL', default='') != '' -%}
        claude-haiku
      {%- elif lmstudio.host is defined -%}
        qwen/qwen3-coder-next
      {%- elif ollama.host is defined -%}
        qwen3-coder
      {%- elif claude_code_openrouter_enabled -%}
        ~anthropic/claude-haiku-latest
      {%- else -%}
        {{ '' }}
      {%- endif -%}

- name: Validate Claude Code models
  ansible.builtin.assert:
    that:
      - item is string
      - claude_code.base_url | trim | length == 0 or item | trim | length > 0
    fail_msg: Claude Code model names must be strings, non-empty when a custom endpoint is used.
  loop:
    - "{{ claude_code.model }}"
    - "{{ claude_code.opus_model }}"
    - "{{ claude_code.sonnet_model }}"
    - "{{ claude_code.haiku_model }}"

- name: Validate Claude API endpoints
  ansible.builtin.assert:
    that:
      - >-
        (claude_code.base_url | default('', true)) == ''
        or claude_code.base_url is match('^https?://')
    fail_msg: Claude API base URL must use HTTP or HTTPS.

- name: Claude Code settings
  ansible.builtin.template:
    mode: "0600"
    src: "templates/settings.j2"
    dest: "~/.claude/settings.json"
    validate: "{{ ansible_playbook_python }} -m json.tool %s"

- name: Claude Code Status Line script
  ansible.builtin.template:
    mode: "0750"
    src: "templates/statusline.j2"
    dest: "~/.claude/statusline.py"

- name: Personnal CLAUDE.md
  ansible.builtin.copy:
    mode: "0640"
    src: CLAUDE.md
    dest: ~/.claude/CLAUDE.md
